# Starting environment for the Python practicals (Weeks 1–6).
# Later geospatial and online-service dependencies are introduced separately.
name: geospatial
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy>=1.26,<3
  - pandas>=2.2,<3
  - matplotlib>=3.8,<4
  - ipykernel>=6,<8
  - notebook>=7,<8
  - jupyterlab>=4,<5
